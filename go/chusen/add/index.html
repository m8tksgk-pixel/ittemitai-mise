<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽選・転売管理</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#1f2a2a">
<meta name="robots" content="noindex">
<style>body{margin:0;background:#1f2a2a;color:#eee;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px;padding:0 24px;text-align:center;line-height:1.7}img{width:120px;height:120px;border-radius:24px}b{color:#7fd6b8}</style>
</head><body>
<img src="../icon-512.png" alt="">
<div><b>抽選・転売管理 をホーム画面に入れる画面です</b></div>
<div>右上の︙（メニューが無いときは、下の緑のボタンでChromeを開いてから） →「ホーム画面に追加」→「インストール」。<br>出てくるアイコンがこの絵（当のチケット）なら成功です。</div>
<div style="font-size:13px;color:#aaa">この画面は自動で移動しません。入れたアイコンを押すと本体が開きます。</div>
<a id="chrome" href="intent://m8tksgk-pixel.github.io/ittemitai-mise/go/chusen/add/#Intent;scheme=https;package=com.android.chrome;end" style="display:none;background:#7fd6b8;color:#10201c;padding:14px 22px;border-radius:14px;font-weight:bold;text-decoration:none;font-size:18px">Chromeで開き直す</a>
<script>if(matchMedia("(display-mode: standalone)").matches||!/Chrome\//.test(navigator.userAgent)||/EdgA|SamsungBrowser|Brave/.test(navigator.userAgent)){document.getElementById("chrome").style.display="inline-block"}</script>
<button id="cp" style="background:#e9b44c;color:#1f1a10;border:0;padding:14px 22px;border-radius:14px;font-weight:bold;font-size:18px">① このページのアドレスをコピー</button>
<div style="font-size:15px">② Chromeを開いて、上のアドレス欄に貼り付けて開く<br>③ Chromeの︙ →「ホーム画面に追加」→「インストール」</div>
<script>document.getElementById("cp").onclick=async function(){var u="https://m8tksgk-pixel.github.io/ittemitai-mise/go/chusen/add/";try{await navigator.clipboard.writeText(u);this.textContent="コピーしました。Chromeに貼り付けてください"}catch(e){var t=document.createElement("textarea");t.value=u;document.body.appendChild(t);t.select();try{document.execCommand("copy");this.textContent="コピーしました。Chromeに貼り付けてください"}catch(_){this.textContent=u}t.remove()}}</script>
</body></html>
